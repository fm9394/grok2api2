services:
  # ── grok2api ──────────────────────────────────────────────────────────────
  grok2api:
    image: ghcr.io/jiujiu532/grok2api:latest
    container_name: grok2api
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:${SERVER_PORT:-8000}"
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8000}
      SERVER_WORKERS: ${SERVER_WORKERS:-1}
      ACCOUNT_STORAGE: ${ACCOUNT_STORAGE:-local}
      ACCOUNT_LOCAL_PATH: ${ACCOUNT_LOCAL_PATH:-data/accounts.db}
      ACCOUNT_REDIS_URL: ${ACCOUNT_REDIS_URL:-}
      ACCOUNT_MYSQL_URL: ${ACCOUNT_MYSQL_URL:-}
      ACCOUNT_POSTGRESQL_URL: ${ACCOUNT_POSTGRESQL_URL:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      init-config:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1.5G
    networks:
      - grok2api
      - apinetwork

  postgres:
    container_name: grok2api-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - grok2api_postgres_data:/var/lib/postgresql/data
      # - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1.5G
    networks:
      - grok2api

  # ── Init: 写入代理配置到 config.toml ──────────────────────────────────────
  init-config:
    image: python:3.13-alpine
    volumes:
      - ./data:/app/data
      - ./scripts:/scripts:ro
    command: ["python3", "/scripts/init_proxy_config.py"]
    restart: "no"
    networks:
      - grok2api

networks:
  grok2api:
    name: grok2api
  apinetwork:
    name: apinetwork

volumes:
  grok2api_postgres_data:
